# fly.toml app configuration file for RoadVision-AI Backend
app = "qala-vision-app"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  PROJECT_NAME = "Qala Vision"
  API_V1_STR = "/api/v1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "uploads_data"
  destination = "/app/uploads"
  initial_size = "1gb"
